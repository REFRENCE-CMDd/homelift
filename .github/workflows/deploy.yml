name: Deploy to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deploy package
        run: |
          curl -sL https://github.com/${{ github.repository }}/releases/download/v1.0/homelift-deploy.zip -o homelift-deploy.zip
          unzip -o homelift-deploy.zip -d deploy
          ls -la deploy/
          ls -la deploy/assets/

      - name: Copy files to site
        run: |
          mkdir -p _site
          cp deploy/index.html _site/
          cp -r deploy/assets _site/
          ls -la _site/
          ls -la _site/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4